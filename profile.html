<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PkmnJourney — Trainer Profile</title>
<meta name="description" content="Your PkmnJourney trainer profile — stats, achievements and settings."/>
<link rel="stylesheet" href="shared.css"/>
<style>
main{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;}

/* Profile hero */
.profile-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.profile-sprite{image-rendering:pixelated;width:80px;height:80px;}
.profile-info{flex:1;min-width:160px;}
.profile-name{font-size:22px;font-weight:bold;color:var(--text);text-transform:uppercase;letter-spacing:2px;}
.profile-starter,.profile-joined{font-size:10px;color:var(--light);margin-top:2px;}

/* Stat boxes */
.stat-grid-profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;}
.stat-box{background:var(--dark);color:var(--bg);padding:12px 8px;text-align:center;border:2px solid var(--border);}
.stat-val{font-size:24px;font-weight:bold;color:var(--text-on-dark);}
.stat-lbl{font-size:8px;letter-spacing:1px;margin-top:2px;color:var(--accent);}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.ach-card{background:var(--card);border:2px solid var(--border);padding:10px 12px;display:flex;align-items:flex-start;gap:10px;}
.ach-card.locked{opacity:.3;filter:grayscale(1);}
.ach-card.unlocked{background:var(--dark);border-color:var(--accent);}
.ach-card.unlocked .ach-name{color:var(--text-on-dark);}
.ach-card.unlocked .ach-desc,.ach-card.unlocked .ach-date{color:var(--accent);}
.ach-item{width:32px;height:32px;image-rendering:pixelated;flex-shrink:0;}
.ach-name{font-size:11px;font-weight:bold;color:var(--text);}
.ach-desc{font-size:9px;color:var(--light);margin-top:2px;line-height:1.4;}
.ach-date{font-size:8px;color:var(--light);margin-top:4px;}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
.theme-card{border:3px solid var(--border);padding:12px 8px;cursor:pointer;text-align:center;transition:all .1s;position:relative;}
.theme-card:hover{border-color:var(--dark);}
.theme-card.selected{border-color:var(--accent);background:var(--dark);}
.theme-card.selected .theme-label{color:var(--text-on-dark);}
.theme-swatches{display:flex;gap:3px;justify-content:center;margin-bottom:8px;}
.theme-swatch{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.2);}
.theme-label{font-size:10px;font-weight:bold;color:var(--text);text-transform:uppercase;letter-spacing:1px;}
.theme-font{font-size:9px;color:var(--light);margin-top:2px;}
.theme-card.selected .theme-font{color:var(--light);}
.selected-tick{position:absolute;top:4px;right:6px;font-size:12px;}

/* Battle mode */
.mode-card{border:2px solid var(--border);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .1s;background:var(--card);}
.mode-card:hover{border-color:var(--accent);}
.mode-card.selected{background:var(--dark);border-color:var(--accent);}
.mode-card.selected .mode-title{color:var(--text-on-dark);}
.mode-card.selected .mode-tag{color:var(--accent);}
.mode-card.selected .mode-desc,.mode-card.selected .mode-bullet{color:var(--text-on-dark);opacity:0.75;}
.mode-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mode-title{font-size:13px;font-weight:bold;color:var(--text,var(--dark));text-transform:uppercase;letter-spacing:1px;}
.mode-tag{font-size:9px;color:var(--mid);background:var(--border);color:var(--bg);padding:2px 6px;border-radius:2px;}
.mode-card.selected .mode-tag{background:var(--dark);}
.mode-desc{font-size:10px;color:var(--text,var(--mid));opacity:0.75;line-height:1.6;margin-bottom:8px;}
.mode-bullets{display:flex;flex-direction:column;gap:3px;}
.mode-bullet{font-size:9px;color:var(--text,var(--mid));opacity:0.75;display:flex;gap:6px;align-items:flex-start;}
.mode-bullet-icon{flex-shrink:0;width:14px;}
.mode-prefix{margin-right:4px;}

/* No profile */
.no-profile{text-align:center;padding:40px 20px;}
.no-profile .big{font-size:48px;margin-bottom:12px;}
.no-profile h2{font-size:16px;text-transform:uppercase;letter-spacing:2px;color:var(--text-on-dark);margin-bottom:6px;}
.no-profile p{font-size:11px;color:var(--accent);margin-bottom:20px;line-height:1.6;}

.btn-danger{background:transparent;color:#c62828;border-color:#c62828;}
.btn-danger:hover{background:#c62828;color:#fff;}

@media(max-width:500px){
  .ach-grid{grid-template-columns:1fr;}
  .theme-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="ad-banner">
  <div class="ad-slot">[ Advertisement — 728×90 ]</div>
</div>

<nav></nav>
<main id="main"></main>

<footer>
  <div>PkmnJourney is a fan-made project, not affiliated with or endorsed by Nintendo, Game Freak or The Pokémon Company.</div>
  <div style="margin-top:4px;">Pokémon and all related names are trademarks of their respective owners.</div>
  <div style="margin-top:8px;"><a href="#">Privacy Policy</a> · <a href="#">Contact</a></div>
</footer>

<script src="data.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="shared.js"></script>
<script>
const ITEM_URL = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${n}.png`;


const THEMES = {
  "Articuno": { desc:"Ice blue",      preview:["#6aacf6","#005273"] },
  "Zapdos":   { desc:"Electric gold", preview:["#ffd541","#d5ac08"] },
  "Moltres":  { desc:"Fire orange",   preview:["#ee6239","#d50808"] },
};


function formatDate(ts){
  if(!ts)return"";
  return new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function showConfirmDialog(message){
  return new Promise(resolve=>{
    // Remove any existing dialog
    document.getElementById("confirmDialog")?.remove();
    const dialog=document.createElement("div");
    dialog.id="confirmDialog";
    dialog.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
    dialog.innerHTML=`
      <div style="background:var(--card);border:3px solid var(--border);padding:24px;max-width:360px;width:100%;">
        <div style="font-size:13px;color:var(--text);margin-bottom:20px;line-height:1.6;">${message}</div>
        <div style="display:flex;gap:8px;">
          <button id="confirmYes" class="btn btn-danger" style="flex:1;">✕ Delete</button>
          <button id="confirmNo" class="btn btn-outline" style="flex:1;">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    document.getElementById("confirmYes").onclick=()=>{dialog.remove();resolve(true);};
    document.getElementById("confirmNo").onclick=()=>{dialog.remove();resolve(false);};
  });
}

async function deleteProfile(){
  const confirmed = await showConfirmDialog("Delete your trainer profile? All progress will be lost. This cannot be undone.");
  if(!confirmed)return;
  
  const user=window.pkmnCurrentUser;

  // Clear localStorage immediately — before any async operations
  localStorage.removeItem("pkmnjourney_profile");
  localStorage.removeItem("pkmnjourney_pokedex");
  window.pkmnCurrentUser=null;

  if(user){
    try{
      await Promise.all([
        _db.doc(`users/${user.uid}/data/profile`).delete(),
        _db.doc(`users/${user.uid}/data/pokedex`).delete(),
        _db.doc(`users/${user.uid}/data/settings`).delete(),
      ]);
      await user.delete();
      console.log("Auth user deleted successfully");
    } catch(e){
      console.error("Delete error code:", e.code, "message:", e.message);
      if(e.code==="auth/requires-recent-login"){
        alert("For security, please log out and log back in before deleting your account.");
        return;
      }
    }
  }

  pkmnUpdateNav();
  render();
}

function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Theme section ──────────────────────────────────────
function renderThemeSection() {
  const cur = pkmnGetPalette();
  const isDark = pkmnGetDarkMode();
  const container = document.getElementById("themeGrid");
  if (!container) return;
  container.innerHTML = "";
  Object.entries(THEMES).forEach(([k, t]) => {
    const p = PKMN_PALETTES[k].light;
    const card = document.createElement("div");
    card.className = "theme-card" + (k === cur ? " selected" : "");
    card.innerHTML = `
      ${k === cur ? '<div class="selected-tick">✔</div>' : ""}
      <div class="theme-swatches">
        ${t.preview.map(c => `<div class="theme-swatch" style="background:${c}"></div>`).join("")}
      </div>
      <div class="theme-label">${k}</div>
      <div class="theme-font">${t.desc}</div>`;
    card.onclick = () => { pkmnApplyPalette(k, isDark); renderThemeSection(); };
    container.appendChild(card);
  });
  // Dark toggle
  const toggle = document.createElement("div");
  toggle.style.cssText = "grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:2px solid var(--border);margin-top:4px;";
  toggle.innerHTML = `
    <span style="font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:var(--text);">Dark Mode</span>
    <button onclick="pkmnToggleDark()" style="font-family:var(--font);font-size:11px;font-weight:bold;padding:4px 14px;border:2px solid var(--border);background:var(--dark);color:var(--text-on-dark);cursor:pointer;text-transform:uppercase;letter-spacing:1px;">${isDark ? "☀ Light" : "☾ Dark"}</button>`;
  container.appendChild(toggle);
}

function switchAuthTab(tab){
  const isLogin = tab === "login";
  document.getElementById("formLogin").style.display = isLogin ? "block" : "none";
  document.getElementById("formCreate").style.display = isLogin ? "none" : "block";
  document.getElementById("tabLogin").style.background = isLogin ? "var(--dark)" : "var(--muted)";
  document.getElementById("tabLogin").style.color = isLogin ? "var(--text-on-dark)" : "var(--light)";
  document.getElementById("tabCreate").style.background = isLogin ? "var(--muted)" : "var(--dark)";
  document.getElementById("tabCreate").style.color = isLogin ? "var(--light)" : "var(--text-on-dark)";
}

async function saveProfile(){
  const name=document.getElementById("usernameInput").value.trim();
  const errEl=document.getElementById("usernameError");
  if(!name){errEl.style.display="block";return;}
  errEl.style.display="none";
  const email=document.getElementById("emailInput").value.trim();
  const password=document.getElementById("passwordInput").value;
  try {
    await pkmnSignUp(email, password, name);
    pkmnUpdateNav();
    render();
  } catch(e) {
    errEl.textContent=e.message;
    errEl.style.display="block";
  }
}

// ── Main render ────────────────────────────────────────
function render(){
  const main=document.getElementById("main");
  const p=pkmnGetProfile();

  main.innerHTML=`
    <!-- TAB BAR -->
    <div style="display:flex;gap:0;width:100%;max-width:700px;margin-top:12px;border:2px solid var(--border);">
      <button id="tab-profile" onclick="switchTab('profile')" style="flex:1;font-family:var(--font);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;padding:10px;border:none;cursor:pointer;background:var(--dark);color:var(--text-on-dark);">
        Trainer
      </button>
      <button id="tab-achievements" onclick="switchTab('achievements')" style="flex:1;font-family:var(--font);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;padding:10px;border:none;border-left:2px solid var(--border);cursor:pointer;background:var(--muted);color:var(--light);">
        Achievements
      </button>
      <button id="tab-settings" onclick="switchTab('settings')" style="flex:1;font-family:var(--font);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;padding:10px;border:none;border-left:2px solid var(--border);cursor:pointer;background:var(--muted);color:var(--light);">
        Settings
      </button>
    </div>

    <!-- TRAINER TAB -->
    <div id="pane-profile" style="width:100%;max-width:700px;">
      ${p ? `
        <div class="card">
          <div class="profile-hero">
            <div style="background:var(--dark);border:2px solid var(--accent);padding:12px 16px;text-align:center;flex-shrink:0;">
              <div style="font-size:8px;color:var(--accent);letter-spacing:2px;margin-bottom:4px;">TRAINER ID</div>
              <div style="font-size:22px;font-weight:bold;color:var(--text-on-dark);letter-spacing:3px;">#${p.trainerId||"000000"}</div>
            </div>
            <div class="profile-info">
              <div class="profile-name">${escHtml(p.name)}</div>
              <div class="profile-joined">Joined ${formatDate(p.created)}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <a href="game.html" class="btn btn-dark">▶ Play</a>
              <button class="btn btn-outline" onclick="pkmnSignOut()">↩ Log Out</button>
              <button class="btn btn-danger" onclick="deleteProfile()">✕ Delete</button>
            </div>
          </div>
          <div class="section-head">📊 Career Stats</div>
          <div class="stat-grid-profile">
            <div class="stat-box"><div class="stat-val">${p.runs||0}</div><div class="stat-lbl">Runs</div></div>
            <div class="stat-box"><div class="stat-val">${p.bestWinPct!==null?p.bestWinPct+"%":"—"}</div><div class="stat-lbl">Best Win %</div></div>
            <div class="stat-box"><div class="stat-val">${new Set((p.achievements||[]).map(a=>a.id)).size}</div><div class="stat-lbl">Achievements</div></div>
            <div class="stat-box"><div class="stat-val">${ACHIEVEMENTS_TOTAL}</div><div class="stat-lbl">Total</div></div>
          </div>
        </div>` : `
        <div class="card">
          <div class="card-title">PkmnJourney</div>
          <div class="card-sub">Sign in or create an account to save your progress across devices.</div>
          <div style="display:flex;gap:0;margin-bottom:16px;border:2px solid var(--border);">
            <button id="tabLogin" onclick="switchAuthTab('login')"
              style="flex:1;font-family:var(--font);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;padding:8px;border:none;cursor:pointer;background:var(--dark);color:var(--text-on-dark);">
              Log In
            </button>
            <button id="tabCreate" onclick="switchAuthTab('create')"
              style="flex:1;font-family:var(--font);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;padding:8px;border:none;cursor:pointer;background:var(--muted);color:var(--light);">
              Create Account
            </button>
          </div>
          <div id="formLogin">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email</label>
              <input class="form-input" type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <input class="form-input" type="password" id="loginPassword" placeholder="Password" autocomplete="current-password"/>
              <div class="form-error" id="loginError"></div>
            </div>
            <button class="btn btn-dark btn-full" onclick="doLogin()">▶ Log In</button>
          </div>
          <div id="formCreate" style="display:none;">
            <div class="form-group">
              <label class="form-label" for="usernameInput">Trainer Name</label>
              <input class="form-input" type="text" id="usernameInput" maxlength="16" placeholder="Enter your name…" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="emailInput">Email</label>
              <input class="form-input" type="email" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="passwordInput">Password</label>
              <input class="form-input" type="password" id="passwordInput" placeholder="Min 6 characters" autocomplete="new-password"/>
              <div class="form-error" id="usernameError"></div>
            </div>
            <button class="btn btn-accent btn-full" onclick="saveProfile()">▶ Create Account</button>
          </div>
        </div>`}
    </div>

    <!-- ACHIEVEMENTS TAB -->
    <div id="pane-achievements" style="display:none;width:100%;max-width:700px;">
      ${p ? `
        <div class="card">
          <div class="card-title">Achievements</div>
          <div class="card-sub">${new Set((p.achievements||[]).map(a=>a.id)).size} of ${ACHIEVEMENTS_TOTAL} unlocked</div>
          <div style="background:var(--mid);border:2px solid var(--border);height:14px;margin-bottom:14px;">
            <div style="background:var(--dark);height:100%;width:${Math.round((new Set((p.achievements||[]).map(a=>a.id)).size/ACHIEVEMENTS_TOTAL)*100)}%;transition:width .4s;"></div>
          </div>
          <div class="ach-grid" id="achGrid"></div>
        </div>` : `
        <div class="card">
          <div class="card-sub" style="padding:20px 0;">Create a profile to track your achievements.</div>
        </div>`}
    </div>

    <!-- SETTINGS TAB -->
    <div id="pane-settings" style="display:none;width:100%;max-width:700px;">
      <div class="card">
        <div class="card-title">Settings</div>
        <div class="card-sub">Preferences are saved locally.</div>
        <div class="section-head" style="display:flex;align-items:center;gap:6px;">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/235.png" style="width:20px;height:20px;image-rendering:pixelated;"/>
          Theme
        </div>
        <div class="theme-grid" id="themeGrid"></div>
        <div class="section-head">⚔️ Battle Mode</div>
        <div class="card-sub" style="text-align:left;margin-bottom:8px;">One loss always ends your run. Choose how battles are calculated.</div>
        <div id="battleModeSection"></div>
        <div class="section-head">🧪 Test Mode</div>
        <div class="card-sub" style="text-align:left;margin-bottom:8px;">Disables run-ending losses and doesn't save results. For testing only.</div>
        <div id="testModeSection"></div>
      </div>
      <div style="width:100%;max-width:700px;">
        <div class="ad-banner" style="border:2px solid #333;">
          <div class="ad-slot">[ Advertisement ]</div>
        </div>
      </div>
    </div>`;

  // Render sections
  renderThemeSection();
  renderBattleModeSection();
  renderTestModeSection();

  // Render achievements grid if logged in
  if(p){
    const unlockedIds=new Set((p.achievements||[]).map(a=>a.id));
    const grid=document.getElementById("achGrid");
    if(grid){
      ACHIEVEMENTS.forEach(ach=>{
        const unlocked=unlockedIds.has(ach.id);
        const entry=unlocked?(p.achievements||[]).find(a=>a.id===ach.id):null;
        const div=document.createElement("div");
        div.className=`ach-card ${unlocked?"unlocked":"locked"}`;
        const showName=(!ach.hidden||unlocked)?ach.name:"???";
        const showDesc=(!ach.hidden||unlocked)?ach.desc:"???";
        const imgSrc=ach.badgeId
          ?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/badges/${ach.badgeId}.png`
          :`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${ach.item}.png`;
        div.innerHTML=`
          <img class="ach-item" src="${imgSrc}" alt="" onerror="this.style.opacity=0"/>
          <div>
            <div class="ach-name">${showName}</div>
            <div class="ach-desc">${showDesc}</div>
            ${unlocked&&entry?`<div class="ach-date">Unlocked ${formatDate(entry.date)}</div>`:""}
          </div>`;
        grid.appendChild(div);
      });
    }
  }

  // Restore active tab
  switchTab(window._activeProfileTab||"profile");
}

function switchTab(tab){
  window._activeProfileTab=tab;
  ["profile","achievements","settings"].forEach(t=>{
    const pane=document.getElementById(`pane-${t}`);
    const btn=document.getElementById(`tab-${t}`);
    if(!pane||!btn)return;
    const active=t===tab;
    pane.style.display=active?"block":"none";
    btn.style.background=active?"var(--dark)":"var(--muted)";
    btn.style.color=active?"var(--text-on-dark)":"var(--light)";
  });
}


// ── Battle Mode ────────────────────────────────────────
// Normal = BST + type, Hard = detailed stats + type
// One loss always ends the run — except in Test Mode

function getBattleMode(){
  return localStorage.getItem("pkmnjourney_battlemode")||"normal";
}

function setBattleMode(m){
  localStorage.setItem("pkmnjourney_battlemode",m);
  renderBattleModeSection();
}

function renderBattleModeSection(){
  const cur=getBattleMode();
  const el=document.getElementById("battleModeSection");
  if(!el)return;
  const modes=[
    {
      id:"normal",title:"Normal",tag:"Default",
      desc:"Win chance based on Base Stat Total and type effectiveness. One loss ends your run.",
      bullets:[
        {icon:"📊",text:"BST ratio determines base win chance"},
        {icon:"🎯",text:"Type advantages and immunities apply"},
        {icon:"😤",text:"Fatigue reduces win chance on consecutive wins"},
      ]
    },
    {
      id:"hard",title:"Hard",tag:"Advanced",
      desc:"Full stat simulation — ATK vs DEF, SpA vs SpD, Speed and HP all matter. One loss ends your run.",
      bullets:[
        {icon:"⚔️",text:"ATK vs DEF or SpA vs SpD — best channel wins"},
        {icon:"⚡",text:"Faster Pokémon strikes first (+10% bonus)"},
        {icon:"❤️",text:"HP durability affects how many hits you survive"},
        {icon:"🎯",text:"Type advantages and immunities apply"},
      ]
    },
  ];
  el.innerHTML="";
  modes.forEach(m=>{
    const card=document.createElement("div");
    card.className="mode-card"+(m.id===cur?" selected":"");
    card.innerHTML=`
      <div class="mode-header">
        <span class="mode-prefix">${m.id===cur?"▶":" "}</span>
        <span class="mode-title">${m.title}</span>
        <span class="mode-tag">${m.tag}</span>
      </div>
      <div class="mode-desc">${m.desc}</div>
      <div class="mode-bullets">
        ${m.bullets.map(b=>`
          <div class="mode-bullet">
            <span class="mode-bullet-icon">${b.icon}</span>
            <span>${b.text}</span>
          </div>`).join("")}
      </div>`;
    card.onclick=()=>setBattleMode(m.id);
    el.appendChild(card);
  });
}

// ── Test Mode ──────────────────────────────────────────
// Dev-only toggle — uses Easy simulation instead of Hard
// Hidden under a plain label so players don't think it's a real option

function getTestMode(){
  return localStorage.getItem("pkmnjourney_testmode")==="true";
}

async function doLogin(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const errEl=document.getElementById("loginError");
  try{
    await pkmnSignIn(email,password);
  } catch(e){
    errEl.textContent=e.message;
    errEl.style.display="block";
  }
}

function toggleTestMode(){
  const cur=getTestMode();
  localStorage.setItem("pkmnjourney_testmode",String(!cur));
  renderTestModeSection();
}

function renderTestModeSection(){
  const on=getTestMode();
  ["testModeSection"].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML=`
      <div class="mode-card${on?" selected":""}" onclick="toggleTestMode()">
        <div class="mode-header">
          <span class="mode-prefix">${on?"▶":" "}</span>
          <span class="mode-title">${on?"Test Mode ON":"Test Mode OFF"}</span>
          <span class="mode-tag">${on?"🧪 Active":"Off"}</span>
        </div>
        <div class="mode-desc">${on
          ?"Using simplified Easy simulation. Results do not count toward profile stats."
          :"Normal rules apply — one loss ends your run."
        }</div>
      </div>`;
  });
}



document.addEventListener("DOMContentLoaded",()=>{
  pkmnInjectNav("profile");
  render();
});
</script>
</body>
</html>
